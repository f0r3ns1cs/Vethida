# /etc/nginx/snippets/vethida-offline.conf
#
# What a browser gets when the Next process behind a site is not answering.
# Included once per HTML-serving server block, at server level:
#
#     server {
#         ...
#         include snippets/vethida-offline.conf;
#         location / { proxy_pass ...; include snippets/vethida-proxy.conf; }
#     }
#
# Deliberately NOT `proxy_intercept_errors on`. These directives fire on errors
# nginx itself generates - a refused or timed-out upstream - and leave a 500 the
# app returned alone. That distinction is the whole point: a running Next
# process answers a 500 with app/error.tsx, which is a better page than this
# one, and intercepting it here would replace a working error boundary with a
# generic outage notice.
#
# 502 is a dead upstream, 504 is one that stopped answering mid-request, and 503
# is nginx refusing before it tries. The original status is preserved - nginx
# only rewrites it when the target carries an explicit `=code` - so monitoring
# and crawlers still see 502 rather than a 200 that renders an apology.
# Retry-After says the outage is temporary rather than letting a crawler treat
# the URL as gone.

error_page 502 503 504 /offline.html;

location = /offline.html {
    root /etc/nginx/html;
    internal;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
}
