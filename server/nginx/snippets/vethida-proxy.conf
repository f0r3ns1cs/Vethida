# /etc/nginx/snippets/vethida-proxy.conf
#
# The header half of every Vethida location block. The site file supplies its
# own `proxy_pass` line and then includes this:
#
#     location / {
#         proxy_pass http://127.0.0.1:3000;
#         include snippets/vethida-proxy.conf;
#     }
#
# proxy_pass deliberately stays in the site file rather than being parameterised
# with a variable here. `proxy_pass $upstream` forwards the raw, un-normalized
# request URI instead of the normalized one, which is a path-traversal surface
# for the sake of saving one line per site.
#
# X-Forwarded-Proto is always https because nginx is the only ingress and the
# plain-HTTP server blocks do nothing but redirect. Passing $scheme instead
# would be technically honest and practically useless, and Next uses this header
# to build absolute URLs - getting it wrong puts an http:// link in a customer's
# email.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $vethida_connection_upgrade;
proxy_read_timeout 60s;
