# /etc/nginx/sites-available/my.vethida.com
#
# Customer portal: accounts, licenses, billing. Uses the SHARED Cloudflare
# Origin Certificate for the vethida.com zone (valid for vethida.com +
# *.vethida.com).
#
# Requires conf.d/vethida-shared.conf (real-IP ranges, $vethida_connection_upgrade).

server {
    listen 80;
    listen [::]:80;
    server_name my.vethida.com;
    return 301 https://my.vethida.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name my.vethida.com;

    ssl_certificate     /etc/ssl/cloudflare/vethida.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vethida.com.key;
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Every request here is a form post or a session-cookie navigation. Nothing
    # uploads, so a small cap is free protection against a body that only exists
    # to occupy a worker.
    client_max_body_size 256k;

    # Response headers, including the nonce-based CSP, come from the app's
    # next.config.ts and middleware. Nginx must not add its own: a second
    # Content-Security-Policy header is intersected with the first by browsers,
    # and debugging that is a bad evening.

    # What a customer sees when the Next process is not answering. This is the
    # surface where nginx's own 502 does the most damage: a customer who has
    # just been sent back from checkout and gets a raw gateway error has no way
    # to tell whether their money moved.
    include snippets/vethida-offline.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/vethida-proxy.conf;
    }
}
