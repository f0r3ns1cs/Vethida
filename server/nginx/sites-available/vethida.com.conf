# /etc/nginx/sites-available/vethida.com
#
# Marketing site. Uses the SHARED Cloudflare Origin Certificate for the
# vethida.com zone (valid for vethida.com + *.vethida.com); the same pair is
# referenced by my.vethida.com.conf and api.vethida.com.conf.
#
# Requires conf.d/vethida-shared.conf (real-IP ranges, $vethida_connection_upgrade).

# HTTP -> HTTPS for both apex and www.
server {
    listen 80;
    listen [::]:80;
    server_name vethida.com www.vethida.com;
    return 301 https://vethida.com$request_uri;
}

# www -> apex over HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vethida.com;

    ssl_certificate     /etc/ssl/cloudflare/vethida.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vethida.com.key;
    # Authenticated Origin Pulls: without this the origin IP is reachable
    # directly and every edge rule in server/firewall/ is optional.
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://vethida.com$request_uri;
}

# Apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vethida.com;

    ssl_certificate     /etc/ssl/cloudflare/vethida.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vethida.com.key;
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 1m;

    # Response headers come from the app: the static ones from next.config.ts,
    # the nonce-based Content-Security-Policy per request from proxy.ts. Nginx
    # must not add its own - a second Content-Security-Policy header is
    # intersected with the first by browsers, and debugging that is a bad
    # evening.
    #
    # No proxy_cache here, and none anywhere else for this site. A cached page
    # is a cached nonce, which hands every visitor the same value the policy
    # exists to keep unguessable.
    # Nginx only owns transport here.

    # What a customer sees when the Next process is not answering. Without it
    # nginx serves its own 502, which is a framework error page in front of a
    # paying customer.
    include snippets/vethida-offline.conf;

    location / {
        proxy_pass http://127.0.0.1:3002;
        include snippets/vethida-proxy.conf;
    }
}
