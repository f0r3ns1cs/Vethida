# /etc/nginx/sites-available/api.vethida.com
#
# Licensing and activation API. Serves the desktop client and receives Polar
# webhooks. Uses the SHARED Cloudflare Origin Certificate for the vethida.com
# zone (valid for vethida.com + *.vethida.com).
#
# Requires conf.d/vethida-shared.conf (real-IP ranges, $vethida_connection_upgrade).

server {
    listen 80;
    listen [::]:80;
    server_name api.vethida.com;
    return 301 https://api.vethida.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.vethida.com;

    ssl_certificate     /etc/ssl/cloudflare/vethida.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vethida.com.key;
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Largest legitimate body is a heartbeat carrying six hardware-anchor
    # hashes. 64k is generous by two orders of magnitude.
    client_max_body_size 64k;

    # No CORS headers, anywhere, deliberately. Nothing here is a public
    # cross-origin API: the desktop client is not a browser and is not subject
    # to the same-origin policy, and the portal talks to this service
    # server-to-server with INTERNAL_API_TOKEN. Adding
    # Access-Control-Allow-Origin would make license endpoints reachable from
    # any page a customer happens to have open.

    # A dead upstream here answers a machine, not a browser: the desktop app
    # activating a license and the portal's server-to-server calls. Both parse
    # JSON, so nginx's HTML 502 would surface as a parse error rather than as
    # the outage it is. No offline page on this host for the same reason.
    #
    # The body is the shape api.vethida.com/lib/errors.ts defines and the
    # desktop's parseErrorBody reads - `{"error":{"code","message"}}`, not a
    # flat object. That parser does fall back to `http_<status>` on anything
    # else, but the fallback exists for proxy pages nobody wrote; a body we
    # author ourselves is a second error shape for one concept.
    #
    # `internal_error` rather than a new code: ERROR_CODES is the contract with
    # deployed desktop builds, and a code the client has never been taught
    # degrades to that same generic fallback.
    error_page 502 503 504 = @upstream_down;

    location @upstream_down {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"internal_error","message":"The licensing service is temporarily unavailable. Try again shortly."}}';
    }

    # Readiness, for whatever sits in front of this instance. Separate from
    # /health so the process supervisor and the load balancer can disagree:
    # /health never touches the database, /ready does.
    location = /ready {
        proxy_pass http://127.0.0.1:3001;
        include snippets/vethida-proxy.conf;
        access_log off;
    }

    # Liveness. Polled every few seconds forever; logging it buries everything
    # else in the access log.
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        include snippets/vethida-proxy.conf;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include snippets/vethida-proxy.conf;
    }
}
