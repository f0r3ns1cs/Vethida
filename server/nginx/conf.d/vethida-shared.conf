# /etc/nginx/conf.d/vethida-shared.conf
#
# http-context configuration shared by all three Vethida sites. Loaded before
# the site files by nginx's default `include /etc/nginx/conf.d/*.conf`.
#
# Everything here exists once on purpose. The Cloudflare range list below is
# published and changes; three copies of it means two of them are wrong after
# the first update, and the symptom is subtle - $remote_addr silently stays the
# Cloudflare edge IP, so rate limits and abuse logging attribute every request
# on the internet to about twenty addresses.

# Off, so nginx stops naming itself and its version in the Server header and in
# the body of every error page it generates itself. A version number in front of
# a customer is a shopping list for anyone matching it against a CVE, and the
# default 502 body reads as a broken server rather than as a product.
server_tokens off;

# Cloudflare ranges: https://www.cloudflare.com/ips/
# Re-fetch that list before every deploy and after any Cloudflare announcement
# that it has changed. A stale range here does not error: $remote_addr quietly
# keeps the edge IP, and rate limiting starts attributing the whole internet to
# about twenty addresses.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Connection header for the upstream, echoing only what the client actually
# asked for. Sending a bare `Connection: upgrade` on every request - which is
# what a hardcoded value does - is invalid for the ~100% of requests that are
# not websocket upgrades, and it defeats keepalive to the Next process.
map $http_upgrade $vethida_connection_upgrade {
    default upgrade;
    ''      close;
}

# Nothing here terminates TLS or sets response security headers. TLS lives in
# the site files because each has its own server_name, and the security headers
# come from each app's next.config.ts, which is their single source of truth.
